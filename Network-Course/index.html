/* ======================================================
   رندر داشبورد
   ====================================================== */
(function renderDashboard() {
  const tabsEl = document.getElementById('track-tabs');
  const infoEl = document.getElementById('track-info');
  const gridEl = document.getElementById('chapter-grid');

  let current = localStorage.getItem('course-track') || 'ccna';

  function chapterId(track, num) {
    return `${track}-${String(num).padStart(2, '0')}`;
  }
  function fileName(track, num) {
    const tr = TRACKS[track];
    return `${tr.prefix}_Ch_${String(num).padStart(2, '0')}.html`;
  }

  function renderTabs() {
    tabsEl.innerHTML = Object.keys(TRACKS).map(k => `
      <div class="track-tab ${k === current ? 'active' : ''}" data-track="${k}">
        ${TRACKS[k].icon} ${TRACKS[k].name}
      </div>
    `).join('');

    tabsEl.querySelectorAll('.track-tab').forEach(t => {
      t.addEventListener('click', () => {
        current = t.dataset.track;
        localStorage.setItem('course-track', current);
        renderTabs();
        renderContent();
      });
    });
  }

  function renderContent() {
    const tr = TRACKS[current];
    document.body.dataset.track = current;

    infoEl.innerHTML = `
      <h2>${tr.icon} ${tr.title}</h2>
      <p>${tr.desc}</p>
      <p><strong>سطح:</strong> ${tr.level} &nbsp;|&nbsp; <strong>پیش‌نیاز:</strong> ${tr.prereq}</p>
      ${tr.warning ? `<div class="box warning" style="margin-top:12px"><div class="box-title">توجه</div>${tr.warning}</div>` : ''}
    `;

    gridEl.innerHTML = tr.chapters.map(ch => {
      const id = chapterId(current, ch.num);
      const done = CourseUtil.isChapterDone(id);
      const href = `chapters/${current}/${fileName(current, ch.num)}`;
      return `
        <a class="chapter-card" href="${href}">
          <div class="num">${ch.num}</div>
          <h3>${ch.title}</h3>
          <p>${ch.desc}</p>
          <div class="status ${done ? 'done' : ''}">
            ${done ? '✅ مطالعه شده' : '⏱ ' + ch.time}
          </div>
        </a>`;
    }).join('');
  }

  renderTabs();
  renderContent();
})();
</script>
